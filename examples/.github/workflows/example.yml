# Canonical use of `pome-sh/run-scenarios-action`.
#
# Drop this file at `.github/workflows/pome.yml` in your repo (after removing
# the `examples/` prefix) and your agent gets a Pome scenario evaluation on
# every pull request.
name: pome

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pome
        uses: pome-sh/run-scenarios-action@v1
        with:
          scenario-path: scenarios/triage-agent.md
          # Spawn your agent. The CLI forwards this to `--agent`.
          agent-command: bun run agents/triage.ts
          # Pin in production:
          # pome-version: 0.5.0
          # Hosted mode (optional):
          # hosted-api-key: ${{ secrets.POME_API_KEY }}

      - name: Print result
        run: |
          echo "Pome result: ${{ steps.pome.outputs.result }}"
          echo "Trace artifact: ${{ steps.pome.outputs.trace-artifact-id }}"
